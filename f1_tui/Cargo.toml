[package]
name = "sectorline"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
crossterm = "0.28"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
ureq = { version = "2.10", features = ["json"] }
